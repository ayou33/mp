# mp web 站点配置(HTTPS 版)
# 使用前提:证书已放入 deploy/certs/(阿里云免费证书 nginx 版解压后:
#   域名.pem → 改名 fullchain.pem,域名.key → 改名 privkey.pem)
# 启用方式:用本文件内容替换 deploy/nginx.conf(或调整 compose 挂载)后
#   docker compose up -d web 重启容器
server {
    listen 80;
    server_name _;

    # 未备案/无证书期间会强制跳 https,可能打不开;
    # 备案与证书就绪后再切换本配置
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- backend REST ----
    location /api/v1/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 腾讯行情同源代理(复刻 vite.config.ts 代理规则)----
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://web.ifzq.gtimg.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host web.ifzq.gtimg.cn;
        proxy_set_header Referer https://gu.qq.com/;
    }

    # 静态资源:内容哈希文件名,长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
