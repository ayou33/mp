# mp web 站点配置(HTTP 版,证书就绪前可直接用)
# HTTPS 版见 nginx.ssl.conf;两个文件不可同时挂载进容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- backend REST:web 将来消费的用户数据/行情走这里 ----
    location /api/v1/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 腾讯行情同源代理:复刻 vite.config.ts 的代理规则 ----
    # /api/appstock/... → https://web.ifzq.gtimg.cn/appstock/...(去掉 /api 前缀,带 Referer)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://web.ifzq.gtimg.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host web.ifzq.gtimg.cn;
        proxy_set_header Referer https://gu.qq.com/;
    }

    # 静态资源:内容哈希文件名,长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
