# mp 单机部署编排(阿里云 ECS 推荐形态)
# 用法(在 deploy/ 目录下):
#   cp .env.example .env && docker compose up -d --build
name: mp

services:
  # ---- REST 后端(Fastify + SQLite)----
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    environment:
      # 显式写死容器内路径,数据库文件落在 mp-data 卷上
      PORT: 3000
      DB_PATH: /app/backend-server/data/mp.db
    volumes:
      - mp-data:/app/backend-server/data
    expose:
      - "3000" # 仅容器网络内可访问,不对宿主机/公网开放
    restart: unless-stopped

  # ---- 前端静态托管 + 反向代理(nginx)----
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # HTTPS 证书目录:阿里云免费证书解压改名后放入 deploy/certs/
      # 证书就绪前可留空目录,此时 nginx.conf(HTTP 版)生效
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  # SQLite 用户数据(自选/浏览/公式/画线)持久化卷;备份时 docker volume 或直接备份 /app/backend-server/data/mp.db
  mp-data:
